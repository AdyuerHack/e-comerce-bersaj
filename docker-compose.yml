version: '3.8'

services:
  django_web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  flask_checkout_service:
    build:
      context: ./flask_app
      dockerfile: Dockerfile
    volumes:
      - ./flask_app:/app
    ports:
      - "5000:5000"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - django_web
      - flask_checkout_service
