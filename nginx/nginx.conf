events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" upstream: $upstream_addr '
                      'rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Upstreams (Servicios backend orquestados)
    upstream django_cluster {
        server django_web:8000;
        keepalive 32;
    }

    upstream flask_catalog_cluster {
        server flask_catalog:5001;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost _;

        # Headers de proxy estándar y trazabilidad
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de resiliencia
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # -------------------------------------------------------------
        # RUTEO API GATEWAY: Microservicio Flask (Catálogo e Inventario)
        # -------------------------------------------------------------
        location /api/v1/products {
            proxy_pass http://flask_catalog_cluster;
        }

        location /api/v1/public/ {
            proxy_pass http://flask_catalog_cluster;
        }

        location /api/v1/inventory/ {
            proxy_pass http://flask_catalog_cluster;
        }

        location /api/v1/tallas/ {
            proxy_pass http://flask_catalog_cluster;
        }

        location /health/catalog {
            proxy_pass http://flask_catalog_cluster/health;
        }

        # -------------------------------------------------------------
        # RUTEO API GATEWAY: Monolito Django (Checkout, UI, Aliado, i18n)
        # -------------------------------------------------------------
        location / {
            proxy_pass http://django_cluster;
        }

        # Healthcheck del Gateway
        location /health {
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx-api-gateway","version":"2.0.0"}';
        }
    }
}
