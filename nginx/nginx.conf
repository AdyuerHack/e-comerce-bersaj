server {
    listen 80;

    # Monolito Legacy
    location / {
        proxy_pass http://django_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Microservicio Nuevo (Checkout estrangulado)
    location /checkout/ {
        proxy_pass http://flask_checkout_service:5000/checkout/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
